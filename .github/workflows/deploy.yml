name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt
          pip install -r backend/requirements.txt
          pip install dbt-postgres

      - name: Load season game data into raw tables
        run: |
          python - <<'PY'
          import os
          from ingestion.config import get_settings
          from ingestion.definitions import raw_games, season_game_codes
          from ingestion.resources import EuroLeagueResource, PostgresResource

          settings = get_settings()
          database_url = os.environ.get("DATABASE_URL") or settings.database_url
          postgres = PostgresResource(database_url=database_url)
          euroleague = EuroLeagueResource()
          games = season_game_codes(euroleague)
          loaded = raw_games(games, postgres)
          print(f"Loaded {loaded} raw game rows for season {settings.euroleague_season}")
          PY

      - name: dbt build
        run: dbt build --project-dir warehouse/dbt_project --profiles-dir warehouse/dbt_project

      - name: Run test suite
        run: |
          PYTHONPATH="$PWD:$PWD/backend" pytest backend/tests ingestion/tests -q

  # Replace this block with a real deployment target when ready:
  # - Fly.io
  # - Railway
  # - Docker build + push to GHCR
  # - Kubernetes / ECS / App Service
  deploy-placeholder:
    needs: validate-main
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder deployment gate
        run: echo "Main branch validated. Add your deploy target here."
