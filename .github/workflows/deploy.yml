name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-main:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: euroleague
          POSTGRES_USER: euroleague
          POSTGRES_PASSWORD: euroleague
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U euroleague -d euroleague"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: euroleague
      POSTGRES_USER: euroleague
      POSTGRES_PASSWORD: euroleague
      DATABASE_URL: postgresql+psycopg://euroleague:euroleague@localhost:5432/euroleague
      PYTHONPATH: .:${{ github.workspace }}/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt
          pip install -r backend/requirements.txt
          pip install dbt-postgres

      - name: Wait for Postgres to accept connections
        run: |
          for i in {1..30}; do
            if pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Prepare Postgres for dbt validation
        run: |
          psql postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$POSTGRES_PORT/$POSTGRES_DB -tc "CREATE SCHEMA IF NOT EXISTS analytics;"
          psql postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$POSTGRES_PORT/$POSTGRES_DB -f ingestion/schema.sql

      - name: Load season game data into raw tables
        run: |
          python - <<'PY'
          import os
          from ingestion.config import get_settings
          from ingestion.definitions import raw_games, season_game_codes
          from ingestion.resources import EuroLeagueResource, PostgresResource

          settings = get_settings()
          database_url = os.environ.get("DATABASE_URL") or settings.database_url
          postgres = PostgresResource(database_url=database_url)
          euroleague = EuroLeagueResource()
          games = season_game_codes(euroleague)
          loaded = raw_games(games, postgres)
          print(f"Loaded {loaded} raw game rows for season {settings.euroleague_season}")
          PY

      - name: dbt build
        run: dbt build --project-dir warehouse/dbt_project --profiles-dir warehouse/dbt_project

      - name: Run test suite
        run: |
          PYTHONPATH="$PWD:$PWD/backend" pytest backend/tests ingestion/tests -q

  # Replace this block with a real deployment target when ready:
  # - Fly.io
  # - Railway
  # - Docker build + push to GHCR
  # - Kubernetes / ECS / App Service
  deploy-placeholder:
    needs: validate-main
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder deployment gate
        run: echo "Main branch validated. Add your deploy target here."
