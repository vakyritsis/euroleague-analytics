name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python-and-dbt:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: euroleague
          POSTGRES_USER: euroleague
          POSTGRES_PASSWORD: euroleague
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U euroleague -d euroleague"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: euroleague
      POSTGRES_USER: euroleague
      POSTGRES_PASSWORD: euroleague
      DATABASE_URL: postgresql+psycopg://euroleague:euroleague@localhost:5432/euroleague
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt
          pip install -r backend/requirements.txt
          pip install dbt-postgres

      - name: Prepare Postgres for dbt validation
        run: |
          psql postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$POSTGRES_PORT/$POSTGRES_DB -tc "CREATE SCHEMA IF NOT EXISTS analytics;"
          psql postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$POSTGRES_PORT/$POSTGRES_DB -f ingestion/schema.sql

      - name: Run backend and ingestion tests
        run: pytest backend/tests ingestion/tests -q

      - name: dbt deps
        run: dbt deps --project-dir warehouse/dbt_project --profiles-dir warehouse/dbt_project

      - name: dbt parse
        run: dbt parse --project-dir warehouse/dbt_project --profiles-dir warehouse/dbt_project
